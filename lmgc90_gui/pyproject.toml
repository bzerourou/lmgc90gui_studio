[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmgc90-gui"
version = "0.1.0"
description = "PyQt6 GUI client for lmgc90_core.Project + lmgc90_engine.EngineSession"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Open Source"}
authors = [{name = "Bachir Zerourou"}]
keywords = ["LMGC90", "DEM", "granular", "PyQt6", "GUI"]
dependencies = [
    "lmgc90-core>=0.1.0",
    "lmgc90-engine>=0.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
qt = ["PyQt6>=6.4"]
viz = ["PyQt6>=6.4", "pyvista>=0.40", "pyvistaqt>=0.11"]
dev = ["pytest>=7.0"]

[project.scripts]
lmgc90-gui = "lmgc90_gui.app:main"

[project.urls]
Repository = "https://github.com/bzerourou/LMG90_GUI_MVC"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
